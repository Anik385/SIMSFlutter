name: sims_mobile
description: Smart Inventory Management System - Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Networking
  dio: ^5.4.0

  # Secure storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # WebSocket
  stomp_dart_client: ^2.0.0
  web_socket_channel: ^2.4.0

  # UI / Charts / Scanner
  fl_chart: ^0.66.0
  mobile_scanner: ^4.0.0
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/